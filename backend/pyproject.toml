[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "jiratron-api"
version = "0.1.0"
description = "JiraTron backend foundation for Jira administration and support estimation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.119.1",
  "pydantic==2.12.3",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jiratron_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
